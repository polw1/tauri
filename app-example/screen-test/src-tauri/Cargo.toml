[package]
name = "tauri-webview-monitor-repro"
version = "0.1.0"
description = "Repro app for Tauri issue #12167"
edition = "2021"

[lib]
name = "tauri_webview_monitor_repro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri = { version = "2", features = [] }
tauri = { path = "../../../crates/tauri", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
